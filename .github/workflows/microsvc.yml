name: Build, Scan and Push Microservices

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (e.g., 100, 101, 102)'
        required: true
        default: '1'
        type: string
permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1   # ✅ sequential execution (IMPORTANT)
      fail-fast: false

      matrix:
        service:
          - name: frontend
            dockerhub_repo: mahmoud235/frontend
            path: src/frontend


          - name: cartservice
            dockerhub_repo: mahmoud235/cartservice
            path: src/cartservice/src
            

          - name: productcatalogservice
            dockerhub_repo: mahmoud235/productcatalogservice
            path: src/productcatalogservice
            

          - name: currencyservice
            dockerhub_repo: mahmoud235/currencyservice
            path: src/currencyservice
            

          - name: paymentservice
            dockerhub_repo: mahmoud235/paymentservice
            path: src/paymentservice
            

          - name: shippingservice
            dockerhub_repo: mahmoud235/shippingservice
            path: src/shippingservice
            

          - name: emailservice
            dockerhub_repo: mahmoud235/emailservice
            path: src/emailservice
            

          - name: checkoutservice
            dockerhub_repo: mahmoud235/checkoutservice
            path: src/checkoutservice
            

          - name: recommendationservice
            dockerhub_repo: mahmoud235/recommendationservice
            path: src/recommendationservice
            

          - name: adservice
            dockerhub_repo: mahmoud235/adservice
            path: src/adservice
            

          - name: loadgenerator
            dockerhub_repo: mahmoud235/loadgenerator
            path: src/loadgenerator
            

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================
      # Clean workspace (IMPORTANT)
      # =========================
      - name: Clean workspace
        run: git clean -fdx


      # =========================
      # Trivy FS Scan
      # =========================
      # 3️⃣ Trivy FS Scan
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.service.path }}

      # =========================
      # Docker Login
      # =========================
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # =========================
      # Build & Push Image
      # =========================
      - name: Build and Push Docker Image
        id: docker
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ matrix.service.dockerhub_repo }}:${{ github.run_number }}

      # =========================
      # Trivy Image Scan
      # =========================
      # 1️⃣1️⃣ Trivy Image Scan
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ matrix.service.dockerhub_repo }}:${{ github.run_number }}

      # =========================
      # Verify Image
      # =========================
      - name: Verify Docker Image
        run: |
          docker pull ${{ matrix.service.dockerhub_repo }}:${{ github.run_number }}
          echo "✔ Image pushed successfully"

      # =========================
      # Output Summary
      # =========================
      - name: Summary
        run: |
          echo "=================================="
          echo "Service: ${{ matrix.service.name }}"
          echo "Build: ${{ github.run_number }}"
          echo "Image: ${{ matrix.service.dockerhub_repo }}:${{ github.run_number }}"
          echo "=================================="