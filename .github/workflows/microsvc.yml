name: Build, Scan and Push Microservices

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (e.g., 100, 101, 102)'
        required: true
        default: '1'
        type: string

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1   # ✅ sequential execution (IMPORTANT)
      fail-fast: false

      matrix:
        service:
          - name: frontend
            dockerhub_repo: mahmoud235/frontend
            path: src/frontend
            dockerfile: src/frontend/Dockerfile

          - name: cartservice
            dockerhub_repo: mahmoud235/cartservice
            path: src/cartservice
            dockerfile: src/cartservice/Dockerfile

          - name: productcatalogservice
            dockerhub_repo: mahmoud235/productcatalogservice
            path: src/productcatalogservice
            dockerfile: src/productcatalogservice/Dockerfile

          - name: currencyservice
            dockerhub_repo: mahmoud235/currencyservice
            path: src/currencyservice
            dockerfile: src/currencyservice/Dockerfile

          - name: paymentservice
            dockerhub_repo: mahmoud235/paymentservice
            path: src/paymentservice
            dockerfile: src/paymentservice/Dockerfile

          - name: shippingservice
            dockerhub_repo: mahmoud235/shippingservice
            path: src/shippingservice
            dockerfile: src/shippingservice/Dockerfile

          - name: emailservice
            dockerhub_repo: mahmoud235/emailservice
            path: src/emailservice
            dockerfile: src/emailservice/Dockerfile

          - name: checkoutservice
            dockerhub_repo: mahmoud235/checkoutservice
            path: src/checkoutservice
            dockerfile: src/checkoutservice/Dockerfile

          - name: recommendationservice
            dockerhub_repo: mahmoud235/recommendationservice
            path: src/recommendationservice
            dockerfile: src/recommendationservice/Dockerfile

          - name: adservice
            dockerhub_repo: mahmoud235/adservice
            path: src/adservice
            dockerfile: src/adservice/Dockerfile

          - name: loadgenerator
            dockerhub_repo: mahmoud235/loadgenerator
            path: src/loadgenerator
            dockerfile: src/loadgenerator/Dockerfile

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Build Number
      # =========================
      - name: Set build number
        id: build
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          else
            BUILD_NUMBER="${{ github.run_number }}"
          fi

          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "build_tag=build-$BUILD_NUMBER" >> $GITHUB_OUTPUT

      # =========================
      # Clean workspace (IMPORTANT)
      # =========================
      - name: Clean workspace
        run: git clean -fdx

      # =========================
      # SonarQube Scan (Local Server)
      # =========================
      - name: SonarQube Scan
        working-directory: ${{ matrix.service.path }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Running SonarQube for ${{ matrix.service.name }}"

          docker run --rm \
            -v "$(pwd):/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=${{ matrix.service.name }} \
            -Dsonar.sources=/usr/src \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN

      # =========================
      # Trivy FS Scan
      # =========================
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ matrix.service.path }}
          format: sarif
          output: trivy-fs-${{ matrix.service.name }}.sarif
          severity: CRITICAL,HIGH

      - name: Upload FS results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-${{ matrix.service.name }}.sarif

      # =========================
      # Docker Login
      # =========================
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # =========================
      # Build & Push Image
      # =========================
      - name: Build and Push Docker Image
        id: docker
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ matrix.service.dockerhub_repo }}:${{ steps.build.outputs.build_tag }}

      # =========================
      # Trivy Image Scan
      # =========================
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service.dockerhub_repo }}:${{ steps.build.outputs.build_tag }}
          format: sarif
          output: trivy-image-${{ matrix.service.name }}.sarif
          severity: CRITICAL,HIGH

      - name: Upload Image results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.service.name }}.sarif

      # =========================
      # Verify Image
      # =========================
      - name: Verify Docker Image
        run: |
          docker pull ${{ matrix.service.dockerhub_repo }}:${{ steps.build.outputs.build_tag }}
          echo "✔ Image pushed successfully"

      # =========================
      # Output Summary
      # =========================
      - name: Summary
        run: |
          echo "=================================="
          echo "Service: ${{ matrix.service.name }}"
          echo "Build: ${{ steps.build.outputs.build_number }}"
          echo "Image: ${{ matrix.service.dockerhub_repo }}:${{ steps.build.outputs.build_tag }}"
          echo "=================================="