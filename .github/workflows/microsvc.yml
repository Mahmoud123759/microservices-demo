name: Build, Scan and Push Microservices

on:
 
    
  workflow_dispatch:
    branches: [ main ]
    inputs:
      build_number:
        description: 'Build number (e.g., 100, 101, 102)'
        required: true
        default: '1'
        type: string
permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1   # ✅ sequential execution (IMPORTANT)
      fail-fast: false

      matrix:
        service:
          - name: shoppingassistantservice
            dockerhub_repo: mahmoud235/shoppingassistantservice
            path: src/shoppingassistantservice


    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================
      # Clean workspace (IMPORTANT)
      # =========================
      - name: Clean workspace
        run: git clean -fdx


      # =========================
      # Trivy FS Scan
      # =========================
      # 3️⃣ Trivy FS Scan
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.service.path }}

      # =========================
      # Docker Login
      # =========================
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # =========================
      # Build & Push Image
      # =========================
      - name: Build and Push Docker Image
        id: docker
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ matrix.service.dockerhub_repo }}:${{ github.run_number }}

      # =========================
      # Trivy Image Scan
      # =========================
      # 1️⃣1️⃣ Trivy Image Scan
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ matrix.service.dockerhub_repo }}:${{ github.run_number }}

      # =========================
      # Verify Image
      # =========================
      - name: Verify Docker Image
        run: |
          docker pull ${{ matrix.service.dockerhub_repo }}:${{ github.run_number }}
          echo "✔ Image pushed successfully"

      # =========================
      # Output Summary
      # =========================
      - name: Summary
        run: |
          echo "=================================="
          echo "Service: ${{ matrix.service.name }}"
          echo "Build: ${{ github.run_number }}"
          echo "Image: ${{ matrix.service.dockerhub_repo }}:${{ github.run_number }}"
          echo "=================================="
